[data-theme="nature"]{--bg:#edf5e4;--bgimg:radial-gradient(ellipse at 90% 0%,#cfe8b955,transparent 50%),radial-gradient(ellipse at 0% 100%,#b6dba055,transparent 50%),linear-gradient(180deg,#f3f9ec,#e3efd6);--surface:#fbfdf7;--ink:#1f3320;--muted:#5b7059;--line:#d1e1c3;--a:#52a52a;--a2:#2f6f1f;--on-a:#fff;--soft:#e2f0d4;--danger:#c8553d;--danger2:#9e3a26;--danger-soft:#f9e6e0;--gold:#e0a100;--shadow:0 1px 2px rgba(31,51,32,.06),0 10px 28px -14px rgba(47,111,31,.35)}
[data-theme="sunset"]{--bg:#fff1e6;--bgimg:linear-gradient(180deg,#fff7f0 0%,#ffe6d4 60%,#ffd6c2 100%);--surface:#fffaf6;--ink:#3b1f14;--muted:#8a6254;--line:#f1d5c4;--a:#f2692c;--a2:#d6336c;--on-a:#fff;--soft:#ffe5d4;--danger:#b3261e;--danger2:#8c1a14;--danger-soft:#fde4e1;--gold:#e8a200;--shadow:0 1px 2px rgba(59,31,20,.06),0 10px 28px -14px rgba(214,51,108,.35)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:var(--bgimg);background-size:var(--bgsize,auto);background-attachment:fixed;color:var(--ink);font:400 17px/1.8 'Koodak','B Nazanin','BNazanin',Tahoma,'Segoe UI',sans-serif;transition:background .25s,color .25s;min-height:100vh}
b,strong,h1,h2,h3,h4,th{font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}
[hidden]{display:none!important}

/* سربرگ */
.top{position:relative;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.top .swoosh{position:absolute;left:0;bottom:0;width:100%;height:34px;pointer-events:none}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px 44px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:relative}
.logo-tile{background:#fff;border-radius:16px;padding:4px 8px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 6px 16px -8px rgba(0,0,0,.35);display:flex;align-items:center}
.logo-tile img{height:76px;width:auto;display:block}
.top h1{margin:0;font-size:1.6rem;line-height:1.3}.top .co{color:var(--muted);font-size:1rem}
.tools{margin-inline-start:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 16px;font-size:1rem;font-weight:700}.who:hover{background:var(--soft)}
.tp{position:relative}
.tpmenu{position:absolute;inset-inline-end:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:15;min-width:190px}
.tpi{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:10px;padding:6px 10px;text-align:start}.tpi:hover{background:var(--soft)}
.tpi .sw{width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}

/* تب‌ها */
.tabs{display:flex;gap:8px;margin:20px 0 18px;overflow-x:auto;padding:2px}
.tabs button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 22px;color:var(--muted);white-space:nowrap;font-weight:700;transition:.15s}
.tabs button:hover{border-color:var(--a)}
.tabs button[aria-selected="true"]{background:linear-gradient(135deg,var(--a),var(--a2));color:var(--on-a);border-color:transparent;box-shadow:0 8px 18px -8px var(--a)}
.weeknav{display:flex;align-items:center;gap:10px;margin:4px 0 16px;flex-wrap:wrap}
.weeknav .lbl{font-weight:700;font-size:1.2rem;flex:1;min-width:200px;text-align:center}
.btn{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 16px;text-decoration:none;color:var(--ink);font-weight:700}
.btn:hover{background:var(--soft)}.btn.primary{background:linear-gradient(135deg,var(--a),var(--a2));border-color:transparent;color:var(--on-a)}
.btn.primary:hover{filter:brightness(1.08)}.btn.danger{color:var(--danger);border-color:var(--danger)}.btn.sm{padding:1px 12px;font-size:.95rem}.btn:disabled{opacity:.5;cursor:not-allowed}
.note{color:var(--muted);font-size:1rem;margin:0 0 14px}
.empty{color:var(--muted);margin:6px 0 0}
.err{color:var(--danger);font-weight:700}

/* تابلوی هفتگی: روزها ستونی، غذاها روبه‌روی هر روز */
.board{display:grid;gap:14px}
.dayrow{display:grid;grid-template-columns:150px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.daycol{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;border-radius:16px;background:linear-gradient(160deg,var(--soft),transparent);padding:10px 6px}
.daycol .dn{font-size:1.5rem;font-weight:700;line-height:1.3}.daycol .dd{color:var(--muted)}
.badge{margin-top:6px;font-size:.85rem;padding:0 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);font-weight:700}
.badge.ok{background:var(--soft);border-color:transparent;color:var(--a)}.badge.skip{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.dishes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.dayrow.off{background:repeating-linear-gradient(135deg,var(--surface) 0 12px,var(--danger-soft) 12px 24px)}
.offmsg{grid-column:1/-1;display:flex;align-items:center;justify-content:center;color:var(--danger);font-weight:700;font-size:1.3rem}
.nomenu{grid-column:1/-1;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.dbox{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 10px;border-radius:20px;background:var(--surface);border:2px solid var(--line);box-shadow:0 2px 0 var(--line);transition:transform .15s,box-shadow .15s,background .2s,border-color .2s}
.dbox:hover:not(:disabled){transform:translateY(-3px);border-color:var(--a);box-shadow:0 14px 26px -14px var(--a)}
.dbox:disabled{cursor:default;opacity:.7}
.dbox .tag{font-size:.8rem;font-weight:700;padding:0 14px;border-radius:999px;background:var(--soft);color:var(--a)}
.dbox .dname{font-size:1.45rem;font-weight:700;line-height:1.4;margin:2px 0}
.dbox .drate{font-weight:700;display:flex;align-items:center;gap:6px;justify-content:center}.dbox .drate .st{color:var(--gold);font-size:1.15rem}.dbox .drate small{color:var(--muted);font-weight:400}
.dbox .dcount{color:var(--muted);font-size:.95rem}
.dbox .dbtn{margin-top:auto;width:100%;padding:3px 0;border-radius:14px;background:var(--soft);color:var(--a);font-weight:700}
.dbox.sel{background:linear-gradient(150deg,var(--a),var(--a2));color:var(--on-a);border-color:transparent;box-shadow:0 16px 30px -12px var(--a)}
.dbox.sel .tag{background:rgba(255,255,255,.25);color:inherit}.dbox.sel .dcount,.dbox.sel .drate small{color:inherit;opacity:.92}
.dbox.sel .dbtn{background:rgba(255,255,255,.96);color:var(--a2)}
.dbox.leave .dname{font-size:1.2rem}
.dbox.leave.sel{background:linear-gradient(150deg,var(--danger),var(--danger2));box-shadow:0 16px 30px -12px var(--danger)}.dbox.leave.sel .dbtn{color:var(--danger2)}
.dbox.leave .tag{background:var(--danger-soft);color:var(--danger)}.dbox.leave .dbtn{background:var(--danger-soft);color:var(--danger)}
.ratebar{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);border-radius:14px;padding:6px 14px;font-weight:700}
.starbtn{background:none;border:0;padding:0 2px;font-size:1.9rem;line-height:1.2;color:var(--line)}.starbtn.on{color:var(--gold)}.starbtn:hover{transform:scale(1.15)}
.stars i{font-style:normal;color:var(--line);font-size:1.3rem}.stars i.on{color:var(--gold)}

/* وضعیت رزروها */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:2rem;line-height:1.3;color:var(--a)}.stat span{color:var(--muted)}
.stat.hero{background:linear-gradient(145deg,var(--a),var(--a2));border:0;color:var(--on-a)}.stat.hero b,.stat.hero span{color:inherit}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 10px;font-size:1.25rem}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0}.bar .nm{width:38%;min-width:110px;font-weight:700}
.bar .tr{flex:1;height:14px;background:var(--soft);border-radius:999px;overflow:hidden}.bar .fl{height:100%;background:linear-gradient(90deg,var(--a),var(--a2));border-radius:999px;transition:width .4s}
.bar .vl{min-width:60px;text-align:start;font-weight:700}
.hist h4{margin:16px 0 6px;color:var(--muted);font-weight:700}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px 14px;margin-bottom:6px}
.row .d{width:130px;flex:none;font-weight:700}.row .f{flex:1;min-width:120px}.row .x{color:var(--danger)}.row .soon{color:var(--muted);font-size:.95rem}

/* ورود */
.login{max-width:460px;margin:34px auto}
.login h2{margin:0 0 6px;font-size:1.6rem}
.field{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 14px}
label.lb{display:block;font-weight:700;margin:12px 0 4px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:22px;padding:24px;max-width:430px;width:100%;text-align:center;box-shadow:var(--shadow)}
.modal h2{margin:0 0 4px;font-size:1.4rem}.modal .stars-row{display:flex;justify-content:center;gap:4px;margin:14px 0;direction:ltr}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:6px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:30;font-weight:700}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:var(--danger);color:#fff}

/* مدیریت */
.adm{display:grid;grid-template-columns:230px 1fr;gap:18px;margin-top:20px}
.side{position:sticky;top:12px;align-self:start;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:10px;box-shadow:var(--shadow)}
.side button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:14px;padding:6px 12px;text-align:start;font-weight:700;color:var(--muted)}
.side button:hover{background:var(--soft)}
.side button[aria-selected="true"]{background:linear-gradient(135deg,var(--a),var(--a2));color:var(--on-a)}
.side .ic{font-size:1.3rem;width:28px;text-align:center}
.page-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}.page-h h2{margin:0;font-size:1.6rem}
.cards4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow);border-top:5px solid var(--a)}
.dcard.hol{border-top-color:var(--danger);background:repeating-linear-gradient(135deg,var(--surface) 0 12px,var(--danger-soft) 12px 24px)}
.dcard h3{margin:0 0 8px;font-size:1.25rem}.dcard input.field{margin-top:6px}
.savebar{position:sticky;bottom:12px;display:flex;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 14px;margin-top:16px;box-shadow:var(--shadow);z-index:5}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px 16px;font-weight:700}
.chip[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
.tile{border-radius:22px;padding:16px;background:linear-gradient(150deg,var(--a),var(--a2));color:var(--on-a);box-shadow:var(--shadow)}
.tile .big{font-size:3.2rem;font-weight:700;line-height:1.1}.tile .t{font-size:1.25rem;font-weight:700}
.tile.red{background:linear-gradient(150deg,var(--danger),var(--danger2))}.tile.gray{background:var(--soft);color:var(--ink);border:1px dashed var(--line);box-shadow:none}
table{width:100%;border-collapse:collapse}th,td{text-align:start;padding:5px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-size:.95rem}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:8px 12px;overflow-x:auto;box-shadow:var(--shadow)}
.tbl input.field{padding:2px 10px;min-width:130px}.ltr{direction:ltr;text-align:right}
details summary{cursor:pointer;color:var(--muted);font-weight:700}
.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:0 12px;margin:2px;font-size:.95rem}.pill.red{background:var(--danger-soft)}
@media(max-width:820px){.adm{grid-template-columns:1fr}.side{position:static;display:flex;overflow-x:auto;gap:4px}.side button{width:auto;white-space:nowrap}
 .dayrow{grid-template-columns:1fr}.daycol{flex-direction:row;justify-content:flex-start;gap:12px;padding:6px 12px}.daycol .badge{margin:0 auto 0 0}
 .logo-tile img{height:58px}.top h1{font-size:1.3rem}.dishes{grid-template-columns:1fr 1fr}.bar .nm{width:100%}.bar{flex-wrap:wrap}}
@media print{.top,.side,.tabs,.weeknav,.chips,.savebar,.noprint{display:none!important}.adm{display:block}body{background:#fff;color:#000}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const mk = st => ({
    get(k) { try { return st.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { st.setItem(k, v); } catch (e) {} },
    del(k) { try { st.removeItem(k); } catch (e) {} }
  });
  const store = mk(localStorage), sess = mk(sessionStorage);
  const app = $('#app');
  (function () { const l = document.createElement('link'); l.rel = 'icon'; l.href = LOGO_SRC; document.head.appendChild(l); })();
  let TOKEN = store.get('tk') || '';
  let ADMIN_KEY = sess.get('ak') || '';

  async function api(path, opts) {
    opts = opts || {};
    if (!API_URL || API_URL.indexOf('PASTE') >= 0) throw new Error('آدرس سرور (Google Apps Script) هنوز در فایل تنظیم نشده است.');
    const parts = path.split('?'), q = {};
    if (parts[1]) parts[1].split('&').forEach(kv => { const i = kv.indexOf('='); q[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1)); });
    const payload = { m: opts.body ? 'POST' : 'GET', path: parts[0], q, body: opts.body || {}, token: opts.admin ? '' : TOKEN, adminKey: opts.admin ? ADMIN_KEY : '' };
    let res;
    try {
      res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    } catch (e) { throw new Error('ارتباط با سرور برقرار نشد. اینترنت را بررسی کنید.'); }
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!data) throw new Error('پاسخ نامعتبر از سرور. آدرس Apps Script و دسترسی «Anyone» را بررسی کنید.');
    if (data.error) { const err = new Error(data.error); err.status = data.status || 400; throw err; }
    return data;
  }
  const qs = o => Object.keys(o).map(k => k + '=' + encodeURIComponent(o[k] == null ? '' : o[k])).join('&');

  /* ---------- تاریخ شمسی (با Intl مرورگر) ---------- */
  const DAY = 864e5;
  const toDate = iso => new Date(iso + 'T12:00:00Z');
  const toISO = d => d.toISOString().slice(0, 10);
  const addDays = (iso, n) => toISO(new Date(toDate(iso).getTime() + n * DAY));
  const weekStart = iso => addDays(iso, -((toDate(iso).getUTCDay() + 1) % 7));
  const DOW = ['یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه', 'شنبه'];
  const MONTHS = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
  const dowName = iso => DOW[toDate(iso).getUTCDay()];
  let pf = null;
  function jparts(iso) {
    try {
      pf = pf || new Intl.DateTimeFormat('en-u-ca-persian-nu-latn', { year: 'numeric', month: 'numeric', day: 'numeric', timeZone: 'UTC' });
      const p = pf.formatToParts(toDate(iso));
      const g = t => parseInt(p.find(x => x.type === t).value, 10);
      return { y: g('year'), m: g('month'), d: g('day') };
    } catch (e) { return { y: 0, m: 1, d: 1 }; }
  }
  const jday = iso => { const j = jparts(iso); return fa(j.d) + ' ' + MONTHS[j.m - 1]; };
  function weekLabel(start) {
    const a = jparts(start), b = jparts(addDays(start, 4));
    if (a.m === b.m) return fa(a.d) + ' تا ' + fa(b.d) + ' ' + MONTHS[b.m - 1] + ' ' + fa(b.y);
    return fa(a.d) + ' ' + MONTHS[a.m - 1] + ' تا ' + fa(b.d) + ' ' + MONTHS[b.m - 1] + ' ' + fa(b.y);
  }
  const FIXED = { '1/1': 'عید نوروز', '1/2': 'عید نوروز', '1/3': 'عید نوروز', '1/4': 'عید نوروز', '1/12': 'روز جمهوری اسلامی', '1/13': 'روز طبیعت',
    '3/14': 'رحلت امام خمینی', '3/15': 'قیام ۱۵ خرداد', '11/22': 'پیروزی انقلاب اسلامی', '12/29': 'روز ملی شدن صنعت نفت' };
  const fixedHoliday = iso => { const j = jparts(iso); return FIXED[j.m + '/' + j.d] || null; };

  /* ---------- تم‌ها (برای افزودن تم: یک مورد به این لیست + یک بلوک data-theme در CSS) ---------- */
  const THEMES = [
    { id: 'classic', label: 'سازمانی (سبز، سفید، قرمز)', c: ['#00b361', '#e03232'] },
    { id: 'dark', label: 'تاریک', c: ['#34c47b', '#17201c'] },
    { id: 'ocean', label: 'اقیانوسی', c: ['#0e9ad6', '#0a5f9e'] },
    { id: 'galaxy', label: 'کهکشانی', c: ['#8b5cf6', '#ec4899'] },
    { id: 'nature', label: 'طبیعت', c: ['#52a52a', '#2f6f1f'] },
    { id: 'sunset', label: 'غروب', c: ['#f2692c', '#d6336c'] }
  ];
  function applyTheme(id) {
    if (!THEMES.some(t => t.id === id)) id = 'classic';
    document.documentElement.setAttribute('data-theme', id);
    store.set('theme', id);
  }
  const themePicker = () => '<div class="tp"><button class="who" id="tpbtn" aria-haspopup="true" aria-expanded="false">🎨 تم</button><div class="tpmenu" id="tpmenu" hidden>' +
    THEMES.map(t => '<button class="tpi" data-theme="' + t.id + '"><span class="sw" style="background:linear-gradient(135deg,' + t.c[0] + ',' + t.c[1] + ')"></span>' + t.label + '</button>').join('') + '</div></div>';
  function bindThemes() {
    const btn = $('#tpbtn'), menu = $('#tpmenu');
    if (!btn) return;
    btn.onclick = ev => { ev.stopPropagation(); menu.hidden = !menu.hidden; btn.setAttribute('aria-expanded', String(!menu.hidden)); };
    $$('.tpi').forEach(b => { b.onclick = () => { applyTheme(b.dataset.theme); menu.hidden = true; }; });
    applyTheme(store.get('theme') || 'classic');
  }
  document.addEventListener('click', () => { const m = $('#tpmenu'); if (m) m.hidden = true; });

  function toast(msg, bad) {
    let t = $('#toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
    clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = ''; }, 2800);
  }
  const stars = n => '<span class="stars" aria-label="' + n + ' از ۵">' + [1, 2, 3, 4, 5].map(i => '<i class="' + (i <= Math.round(n) ? 'on' : '') + '">★</i>').join('') + '</span>';
  const starButtons = (date, cur) => [1, 2, 3, 4, 5].map(n =>
    '<button class="starbtn ' + (n <= cur ? 'on' : '') + '" data-rate="' + n + '" data-date="' + date + '" aria-label="' + fa(n) + ' ستاره">★</button>').join('');
  const avgTxt = a => fa(a.toFixed(1)).replace('.', '٫');

  const SWOOSH = '<svg class="swoosh" viewBox="0 0 1000 90" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="sg" x1="1" x2="0"><stop offset="0" style="stop-color:#00a859"/><stop offset=".55" style="stop-color:#00a859"/><stop offset=".75" style="stop-color:#e03232"/><stop offset="1" style="stop-color:#e03232"/></linearGradient></defs><path d="M0 70 C 260 4, 650 -10, 1000 52 C 640 22, 280 30, 0 82 Z" fill="url(#sg)"/></svg>';
  const header = (title, extra) => '<div class="top"><div class="top-in"><div class="logo-tile"><img src="' + LOGO_SRC + '" alt="لوگوی شرکت ترکیب حمل و نقل"></div>' +
    '<div><h1>' + title + '</h1><div class="co">شرکت ترکیب حمل و نقل</div></div><div class="tools">' + (extra || '') + themePicker() + '</div></div>' + SWOOSH + '</div>';

  /* =====================================================================
     بخش همکاران
     ===================================================================== */
  const S = { name: '', start: null, week: null, tab: 'week', dismissed: false, must: false };

  async function ucall(path, opts) {
    try { return await api(path, opts); }
    catch (e) {
      if (e.status === 401 && path !== 'login') { logout('نشست شما منقضی شد. دوباره وارد شوید.'); }
      throw e;
    }
  }
  function logout(msg) {
    TOKEN = ''; store.del('tk'); S.dismissed = false;
    showLogin(msg);
  }

  function showLogin(msg) {
    app.onclick = null;
    app.innerHTML = header('رزرو ناهار') + '<main class="wrap"><div class="login panel"><h2>ورود به سامانه</h2>' +
      '<p class="note">نام کاربری شما کد ملی‌تان است. اگر اولین بار است وارد می‌شوید، رمز عبور <b>۱۲۳۴</b> است و بعد از ورود باید رمز جدید بگذارید.</p>' +
      (msg ? '<p class="err">' + esc(msg) + '</p>' : '') +
      '<label class="lb" for="u">کد ملی</label><input class="field ltr" id="u" inputmode="numeric" autocomplete="username" maxlength="10" placeholder="۱۰ رقم">' +
      '<label class="lb" for="p">رمز عبور</label><input class="field ltr" id="p" type="password" autocomplete="current-password">' +
      '<p class="err" id="err"></p><button class="btn primary" id="go" style="width:100%">ورود</button></div></main>';
    bindThemes();
    const go = async () => {
      const btn = $('#go'); btn.disabled = true; $('#err').textContent = '';
      try {
        const r = await api('login', { body: { username: $('#u').value, password: $('#p').value } });
        TOKEN = r.token; store.set('tk', TOKEN); S.name = r.name; S.must = r.mustChange; startApp();
      } catch (e) { $('#err').textContent = e.message; btn.disabled = false; }
    };
    $('#go').onclick = go;
    $('#p').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    $('#u').focus();
  }

  async function startApp() {
    if (!TOKEN) return showLogin();
    if (!S.name) {
      try { const m = await ucall('me'); S.name = m.name; S.must = m.mustChange; } catch (e) { return; }
    }
    if (S.must) return showForceChange();
    showApp();
  }

  function passwordForm(forced) {
    return '<label class="lb" for="po">رمز فعلی' + (forced ? ' (۱۲۳۴)' : '') + '</label><input class="field ltr" id="po" type="password" autocomplete="current-password">' +
      '<label class="lb" for="pn">رمز جدید (حداقل ۶ نویسه)</label><input class="field ltr" id="pn" type="password" autocomplete="new-password">' +
      '<label class="lb" for="pr">تکرار رمز جدید</label><input class="field ltr" id="pr" type="password" autocomplete="new-password">' +
      '<p class="err" id="perr"></p><button class="btn primary" id="psave">ذخیرهٔ رمز جدید</button>';
  }
  function bindPasswordForm(done) {
    $('#psave').onclick = async () => {
      const o = $('#po').value, n = $('#pn').value, r = $('#pr').value, er = $('#perr');
      er.textContent = '';
      if (n !== r) { er.textContent = 'تکرار رمز با رمز جدید یکی نیست'; return; }
      try {
        const res = await ucall('password', { body: { old: o, new: n } });
        TOKEN = res.token; store.set('tk', TOKEN); S.must = false; toast('رمز شما تغییر کرد'); done();
      } catch (e) { er.textContent = e.message; }
    };
  }
  function showForceChange() {
    app.onclick = null;
    app.innerHTML = header('رزرو ناهار', '<button class="who" id="lo">خروج</button>') + '<main class="wrap"><div class="login panel"><h2>رمز جدید انتخاب کنید</h2>' +
      '<p class="note">' + esc(S.name) + ' عزیز، برای امنیت حساب‌تان لطفاً قبل از ادامه رمز اولیه را عوض کنید.</p>' + passwordForm(true) + '</div></main>';
    bindThemes();
    $('#lo').onclick = () => logout();
    bindPasswordForm(showApp);
  }

  async function showApp() {
    app.innerHTML = header('رزرو ناهار', '<button class="who" id="lo" title="خروج از حساب">' + esc(S.name) + ' · خروج</button>') +
      '<main class="wrap"><div class="tabs" role="tablist"><button role="tab" data-tab="week">🍽️ رزرو غذا</button><button role="tab" data-tab="stats">📊 وضعیت رزروها</button><button role="tab" data-tab="account">🔑 حساب من</button></div><section id="view"></section></main>';
    bindThemes();
    app.onclick = userClick;
    $('#lo').onclick = () => logout();
    $$('.tabs button').forEach(b => b.addEventListener('click', () => { S.tab = b.dataset.tab; renderTab(); }));
    await renderTab();
    checkPending();
  }
  async function renderTab() {
    $$('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
    if (S.tab === 'week') return renderWeek();
    if (S.tab === 'stats') return renderStats();
    return renderAccount();
  }

  async function loadWeek() { S.week = await ucall('week?' + qs({ start: S.start || '' })); S.start = S.week.start; }
  async function renderWeek() {
    const v = $('#view');
    v.innerHTML = '<p class="note">در حال بارگذاری…</p>';
    try { await loadWeek(); } catch (e) { v.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; return; }
    drawWeek();
  }
  function drawWeek() {
    const W = S.week, v = $('#view');
    const lockTxt = W.lockDays === 0 ? 'ثبت یا تغییر انتخاب تا پایان همان روز ممکن است.'
      : 'ثبت یا تغییر انتخاب هر روز تا پایان ' + fa(W.lockDays) + ' روز قبل از آن روز ممکن است.';
    v.innerHTML = '<div class="weeknav"><button class="btn" id="next">هفتهٔ بعد ›</button><div class="lbl">' + weekLabel(W.start) + '</div>' +
      '<button class="btn" id="prev">‹ هفتهٔ قبل</button><button class="btn" id="now">این هفته</button></div>' +
      '<p class="note">' + lockTxt + ' روی کادر هر غذا بزنید تا رزرو شود؛ دوباره بزنید تا لغو شود.</p>' +
      '<div class="board">' + W.days.map(dayRow).join('') + '</div>';
    $('#prev').onclick = () => { S.start = addDays(W.start, -7); renderWeek(); };
    $('#next').onclick = () => { S.start = addDays(W.start, 7); renderWeek(); };
    $('#now').onclick = () => { S.start = null; renderWeek(); };
  }
  function dayRow(d) {
    const hol = d.holiday || fixedHoliday(d.date), my = d.my;
    let badge = '<span class="badge">انتخاب نشده</span>';
    if (hol) badge = '<span class="badge skip">تعطیل</span>';
    else if (my && my.skip) badge = '<span class="badge skip">مرخصی</span>';
    else if (my) badge = '<span class="badge ok">ثبت شد ✓</span>';
    else if (!d.items.length) badge = '<span class="badge">منو ثبت نشده</span>';
    else if (d.locked) badge = '<span class="badge">مهلت تمام شد</span>';
    let body = '';
    if (hol) body = '<div class="offmsg">🎉 ' + esc(hol) + '</div>';
    else if (!d.items.length) body = '<div class="nomenu">منوی این روز هنوز مشخص نشده است.</div>';
    else {
      const dis = d.locked ? 'disabled' : '';
      body = d.items.map((it, i) => {
        const sel = my && !my.skip && my.item === i;
        return '<button class="dbox ' + (sel ? 'sel' : '') + '" data-item="' + i + '" ' + dis + '><span class="tag">ناهار</span><span class="dname">' + esc(it.name) + '</span>' +
          '<span class="drate">' + (it.votes ? '<span class="st">★</span>' + avgTxt(it.avg) + '<small>(' + fa(it.votes) + ' رأی)</small>' : '<small>هنوز امتیازی ندارد</small>') + '</span>' +
          '<span class="dcount">' + fa(it.count) + ' نفر رزرو کرده‌اند</span><span class="dbtn">' + (sel ? 'رزرو شد ✓' : 'رزرو') + '</span></button>';
      }).join('') +
        '<button class="dbox leave ' + (my && my.skip ? 'sel' : '') + '" data-skip="1" ' + dis + '><span class="tag">مرخصی</span><span class="dname">غذا نمی‌خورم</span><span class="drate"><small>&nbsp;</small></span>' +
        '<span class="dcount">' + fa(d.skipCount) + ' نفر</span><span class="dbtn">' + (my && my.skip ? 'ثبت شد ✓' : 'ثبت مرخصی') + '</span></button>';
      if (d.locked && !my) body += '<div class="nomenu">مهلت ثبت برای این روز تمام شده است.</div>';
      if (my && !my.skip && d.rateOpen) body += '<div class="ratebar">' + (d.stars ? 'امتیاز شما به «' + esc(d.items[my.item].name) + '»:' : 'به «' + esc(d.items[my.item].name) + '» امتیاز بدهید:') + ' ' + starButtons(d.date, d.stars || 0) + '</div>';
    }
    return '<article class="dayrow ' + (hol ? 'off' : '') + '" data-date="' + d.date + '"><div class="daycol"><span class="dn">' + dowName(d.date) + '</span><span class="dd">' + jday(d.date) + '</span>' + badge + '</div>' +
      '<div class="dishes">' + body + '</div></article>';
  }

  async function userClick(ev) {
    const box = ev.target.closest('.dbox');
    if (box && !box.disabled) {
      const row = box.closest('.dayrow'), date = row.dataset.date;
      const d = S.week.days.find(x => x.date === date);
      let payload;
      if (box.dataset.skip) payload = (d.my && d.my.skip) ? { item: null } : { skip: true };
      else { const i = +box.dataset.item; payload = (d.my && !d.my.skip && d.my.item === i) ? { item: null } : { item: i }; }
      const prev = d.my;
      d.my = payload.skip ? { item: null, skip: true } : (payload.item !== null ? { item: payload.item, skip: false } : null);
      row.outerHTML = dayRow(d);
      try {
        await ucall('reserve', { body: Object.assign({ date }, payload) });
        toast(d.my ? 'ثبت شد ✓' : 'انتخاب پاک شد');
      } catch (e) { d.my = prev; toast(e.message, true); }
      try { await loadWeek(); drawWeek(); } catch (e) {}
      return;
    }
    const rb = ev.target.closest('.starbtn[data-rate]');
    if (rb) {
      try {
        await ucall('rate', { body: { date: rb.dataset.date, stars: +rb.dataset.rate } });
        toast('امتیاز ثبت شد');
        if (S.tab === 'week') { await loadWeek(); drawWeek(); } else if (S.tab === 'stats') renderStats();
      } catch (e) { toast(e.message, true); }
    }
  }

  async function renderStats() {
    const v = $('#view');
    v.innerHTML = '<p class="note">در حال بارگذاری…</p>';
    let h;
    try { h = await ucall('stats'); } catch (e) { v.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; return; }
    const rows = h.rows, groups = {};
    rows.forEach(r => { const k = weekStart(r.date); (groups[k] = groups[k] || []).push(r); });
    const keys = Object.keys(groups).sort().reverse();
    const max = h.top.length ? h.top[0].count : 1;
    v.innerHTML = '<div class="stats">' +
      '<div class="stat hero"><b>' + fa(h.total) + '</b><span>ناهار رزروشده تا امروز</span></div>' +
      '<div class="stat"><b style="font-size:1.4rem">' + (h.top.length ? esc(h.top[0].name) : '—') + '</b><span>' + (h.top.length ? 'پرتکرارترین غذای شما (' + fa(h.top[0].count) + ' بار)' : 'پرتکرارترین غذای شما') + '</span></div>' +
      '<div class="stat"><b>' + fa(h.upcoming) + '</b><span>رزرو در پیش‌رو</span></div>' +
      '<div class="stat"><b>' + fa(h.skipped) + '</b><span>روز مرخصی</span></div>' +
      '<div class="stat"><b>' + (h.rated ? avgTxt(h.avgGiven) : '—') + '</b><span>میانگین امتیازهای شما (' + fa(h.rated) + ' امتیاز)</span></div></div>' +
      '<div class="panel"><h3>غذاهای مورد علاقهٔ شما</h3>' + (h.top.length ? h.top.map(t => '<div class="bar"><span class="nm">' + esc(t.name) + '</span><span class="tr"><span class="fl" style="display:block;width:' + Math.round(t.count / max * 100) + '%"></span></span><span class="vl">' + fa(t.count) + ' بار</span></div>').join('') : '<p class="empty">هنوز غذایی نگرفته‌اید.</p>') + '</div>' +
      '<div class="hist"><h3 style="margin:18px 0 0">تاریخچهٔ رزروها</h3>' + (keys.length ? keys.map(k => '<h4>هفتهٔ ' + weekLabel(k) + '</h4>' + groups[k].sort((a, b) => a.date < b.date ? 1 : -1).map(r =>
        '<div class="row"><span class="d">' + dowName(r.date) + ' ' + jday(r.date) + '</span><span class="f ' + (r.skip ? 'x' : '') + '">' + (r.skip ? 'مرخصی / غذا نمی‌خورم' : '<b>' + esc(r.item) + '</b>') + '</span>' +
        (r.date > h.today ? '<span class="soon">در پیش است</span>' : (!r.skip && r.rateOpen ? starButtons(r.date, r.stars || 0) : '')) + '</div>').join('')).join('')
        : '<p class="empty">هنوز غذایی رزرو نکرده‌اید. به تب «رزرو غذا» بروید.</p>') + '</div>';
  }

  function renderAccount() {
    $('#view').innerHTML = '<div class="panel" style="max-width:480px"><h3>تغییر رمز عبور</h3><p class="note">نام کاربری شما همان کد ملی‌تان است و از طریق این صفحه تغییر نمی‌کند.</p>' + passwordForm(false) + '</div>';
    bindPasswordForm(() => { $('#po').value = ''; $('#pn').value = ''; $('#pr').value = ''; });
  }

  async function checkPending() {
    if (S.dismissed) return;
    let list;
    try { list = (await ucall('pending')).pending; } catch (e) { return; }
    if (!list.length || $('.overlay')) return;
    const p = list[0];
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">غذای ' + dowName(p.date) + ' ' + jday(p.date) + ' چطور بود؟</h2>' +
      '<div style="font-size:1.3rem"><b>' + esc(p.name) + '</b></div><div class="stars-row">' + [5, 4, 3, 2, 1].map(n => '<button class="starbtn" data-n="' + n + '" aria-label="' + fa(n) + ' ستاره">★</button>').join('') +
      '</div><button class="btn" id="later">بعداً</button></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', async ev => {
      if (ev.target.id === 'later') { S.dismissed = true; ov.remove(); return; }
      const b = ev.target.closest('[data-n]'); if (!b) return;
      try {
        await ucall('rate', { body: { date: p.date, stars: +b.dataset.n } });
        ov.remove(); toast('ممنون از امتیازتان');
        if (S.tab === 'week') { await loadWeek(); drawWeek(); } else if (S.tab === 'stats') renderStats();
        if (list.length > 1) setTimeout(checkPending, 400);
      } catch (e) { toast(e.message, true); }
    });
    const first = $('[data-n="5"]', ov); if (first) first.focus();
  }

  /* =====================================================================
     بخش مدیر  (آدرس: /#admin)
     ===================================================================== */
  const A = { page: 'dash', start: null, day: null };
  const PAGES = [['dash', '📈', 'داشبورد'], ['menu', '📝', 'منوی هفته'], ['kitchen', '🍳', 'گزارش آشپزخانه'], ['emps', '👥', 'همکاران'], ['rates', '⭐', 'امتیاز غذاها'], ['settings', '⚙️', 'تنظیمات']];

  async function adminMain() {
    app.onclick = null;
    if (ADMIN_KEY) {
      try { await api('admin/check', { admin: true }); return showAdmin(); } catch (e) { ADMIN_KEY = ''; sess.del('ak'); }
    }
    app.innerHTML = header('ورود مدیر') + '<main class="wrap"><div class="login panel"><h2>ورود مدیر</h2>' +
      '<input class="field ltr" type="password" id="pw" placeholder="رمز مدیر" autocomplete="current-password"><p class="err" id="err"></p>' +
      '<button class="btn primary" id="go">ورود</button> <a class="btn" href="#">صفحهٔ همکاران</a></div></main>';
    bindThemes();
    const go = async () => {
      ADMIN_KEY = $('#pw').value;
      try { await api('admin/check', { admin: true }); sess.set('ak', ADMIN_KEY); showAdmin(); }
      catch (e) { ADMIN_KEY = ''; $('#err').textContent = e.message; }
    };
    $('#go').onclick = go;
    $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    $('#pw').focus();
  }
  function showAdmin() {
    app.innerHTML = header('پنل مدیریت ناهار', '<a class="btn sm" href="#">صفحهٔ همکاران</a><button class="who" id="logout">خروج</button>') +
      '<main class="wrap"><div class="adm"><nav class="side" aria-label="بخش‌های مدیریت">' +
      PAGES.map(p => '<button data-page="' + p[0] + '"><span class="ic">' + p[1] + '</span>' + p[2] + '</button>').join('') + '</nav><section id="view"></section></div></main>';
    bindThemes();
    $('#logout').onclick = () => { ADMIN_KEY = ''; sess.del('ak'); adminMain(); };
    $$('.side button').forEach(b => { b.onclick = () => { A.page = b.dataset.page; adminRender(); }; });
    adminRender();
  }
  function adminRender() {
    $$('.side button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.page === A.page)));
    ({ dash: pageDash, menu: pageMenu, kitchen: pageKitchen, emps: pageEmps, rates: pageRates, settings: pageSettings })[A.page]();
  }
  const guard = fn => async function () {
    try { return await fn.apply(this, arguments); }
    catch (e) { if (e.status === 401) { ADMIN_KEY = ''; sess.del('ak'); adminMain(); } else toast(e.message, true); }
  };
  const weekNav = start => '<div class="weeknav noprint"><button class="btn" id="next">هفتهٔ بعد ›</button><div class="lbl">' + weekLabel(start) + '</div>' +
    '<button class="btn" id="prev">‹ هفتهٔ قبل</button><button class="btn" id="now">این هفته</button></div>';
  function bindNav(start) {
    $('#prev').onclick = () => { A.start = addDays(start, -7); adminRender(); };
    $('#next').onclick = () => { A.start = addDays(start, 7); adminRender(); };
    $('#now').onclick = () => { A.start = null; adminRender(); };
  }
  const pageHead = (t, extra) => '<div class="page-h"><h2>' + t + '</h2>' + (extra || '') + '</div>';
  const pills = (arr, cls) => arr.length ? arr.map(n => '<span class="pill ' + (cls || '') + '">' + esc(n) + '</span>').join('') : '—';

  /* ----- داشبورد ----- */
  const pageDash = guard(async () => {
    const D = await api('admin/dashboard', { admin: true });
    const v = $('#view');
    const todayRow = D.days.find(d => d.date === D.today);
    const weekAnswered = D.days.filter(d => d.hasMenu && !d.holiday).reduce((a, d) => a + d.answered, 0);
    const weekSlots = D.days.filter(d => d.hasMenu && !d.holiday).length * D.total;
    const pct = weekSlots ? Math.round(weekAnswered / weekSlots * 100) : 0;
    const topMax = D.topDishes.length ? D.topDishes[0].count : 1;
    v.innerHTML = pageHead('داشبورد', '<span class="note" style="margin:0">هفتهٔ ' + weekLabel(D.weekStart) + '</span>') +
      '<div class="cards4"><div class="stat hero"><b>' + fa(D.total) + '</b><span>همکار فعال</span></div>' +
      '<div class="stat"><b>' + fa(pct) + '٪</b><span>پرشدن انتخاب‌های این هفته</span></div>' +
      '<div class="stat"><b>' + (todayRow && todayRow.hasMenu ? fa(todayRow.items.reduce((a, i) => a + i.count, 0)) : '—') + '</b><span>رزرو ناهار امروز</span></div>' +
      '<div class="stat"><b>' + fa(D.next.pending.length) + '</b><span>نفر هنوز هفتهٔ بعد را کامل انتخاب نکرده‌اند</span></div></div>' +
      '<div class="panel"><h3>وضعیت روزهای این هفته</h3>' + D.days.map(d => {
        if (d.holiday || fixedHoliday(d.date)) return '<div class="bar"><span class="nm">' + dowName(d.date) + ' ' + jday(d.date) + '</span><span class="vl err">تعطیل</span></div>';
        if (!d.hasMenu) return '<div class="bar"><span class="nm">' + dowName(d.date) + ' ' + jday(d.date) + '</span><span class="vl note" style="margin:0">منو ثبت نشده</span></div>';
        const rs = d.items.reduce((a, i) => a + i.count, 0);
        return '<div class="bar"><span class="nm">' + dowName(d.date) + ' ' + jday(d.date) + '</span><span class="tr"><span class="fl" style="display:block;width:' + (D.total ? Math.round(d.answered / D.total * 100) : 0) + '%"></span></span>' +
          '<span class="vl">' + fa(rs) + ' غذا · ' + fa(d.skip) + ' مرخصی</span></div>';
      }).join('') + '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px">' +
      '<div class="panel"><h3>پرسفارش‌ترین غذاهای این هفته</h3>' + (D.topDishes.length ? D.topDishes.map(t => '<div class="bar"><span class="nm">' + esc(t.name) + '</span><span class="tr"><span class="fl" style="display:block;width:' + Math.round(t.count / topMax * 100) + '%"></span></span><span class="vl">' + fa(t.count) + '</span></div>').join('') : '<p class="empty">هنوز رزروی ثبت نشده.</p>') + '</div>' +
      '<div class="panel"><h3>بهترین غذاها از نگاه همکاران</h3>' + (D.bestRated.length ? D.bestRated.map(b => '<div class="bar"><span class="nm">' + esc(b.name) + '</span><span class="vl">' + stars(b.avg) + ' ' + avgTxt(b.avg) + '</span></div>').join('') : '<p class="empty">هنوز امتیازی ثبت نشده.</p>') + '</div></div>' +
      '<div class="panel"><h3>هفتهٔ بعد (' + weekLabel(D.next.start) + ')</h3>' + (!D.next.hasMenu ? '<p class="err">منوی هفتهٔ بعد هنوز ثبت نشده است. از بخش «منوی هفته» وارد کنید.</p>' :
        '<p class="note">منو برای ' + fa(D.next.menuDays) + ' روز ثبت شده است.</p>' + (D.next.pending.length ? '<details open><summary>' + fa(D.next.pending.length) + ' نفر هنوز انتخاب خود را کامل نکرده‌اند</summary>' + pills(D.next.pending) + '</details>' : '<p>✅ همه انتخاب‌هایشان را کامل کرده‌اند.</p>')) + '</div>';
  });

  /* ----- منوی هفته ----- */
  const pageMenu = guard(async () => {
    const W = await api('admin/week?' + qs({ start: A.start || '' }), { admin: true });
    A.start = W.start;
    const v = $('#view');
    v.innerHTML = pageHead('منوی هفته') + weekNav(W.start) +
      '<p class="note">برای هر روز تا ۴ غذا بنویسید (حداکثر ۶). گزینهٔ «غذا نمی‌خورم» خودکار برای همهٔ روزها هست. اگر نام غذایی را بعد از شروع رزروها عوض کنید، رزرو آن غذا باطل می‌شود.</p><div class="menu-grid">' +
      W.days.map(d => {
        const fx = fixedHoliday(d.date), n = Math.max(4, d.items.length);
        let inputs = ''; for (let i = 0; i < n; i++) inputs += '<input class="field it" placeholder="غذای ' + fa(i + 1) + '" value="' + esc(d.items[i] || '') + '" ' + (fx ? 'disabled' : '') + '>' + (d.items[i] ? '<div class="note" style="margin:0 6px">' + fa(d.counts[i]) + ' رزرو</div>' : '');
        return '<div class="dcard ' + (d.holiday || fx ? 'hol' : '') + '" data-date="' + d.date + '"><h3>' + dowName(d.date) + ' · ' + jday(d.date) + '</h3>' +
          (fx ? '<p class="err">تعطیل رسمی: ' + esc(fx) + '</p>' : '<label><input type="checkbox" class="hol" ' + (d.holiday ? 'checked' : '') + '> این روز تعطیل است</label><input class="field htitle" placeholder="مناسبت (اختیاری)" value="' + esc(d.holiday || '') + '">') +
          '<div class="its">' + inputs + '</div>' + (fx ? '' : '<button class="btn sm addit" style="margin-top:8px">+ غذای دیگر</button>') + '</div>';
      }).join('') + '</div>' +
      '<div class="savebar"><button class="btn primary" id="save">💾 ذخیرهٔ منوی هفته</button><button class="btn" id="copy">کپی منوی هفتهٔ قبل در این هفته</button></div>';
    bindNav(W.start);
    v.onclick = ev => {
      const b = ev.target.closest('.addit'); if (!b) return;
      const box = $('.its', b.closest('.dcard'));
      if ($$('.it', box).length >= 6) return toast('حداکثر ۶ غذا', true);
      const i = document.createElement('input'); i.className = 'field it'; i.placeholder = 'غذای دیگر'; box.appendChild(i); i.focus();
    };
    $('#save').onclick = guard(async () => {
      const days = {}, holidays = {};
      $$('.dcard', v).forEach(card => {
        const its = $$('.it', card); if (its.length && its[0].disabled) return;
        const date = card.dataset.date, hol = $('.hol', card), off = !!(hol && hol.checked);
        holidays[date] = { off, title: $('.htitle', card).value };
        days[date] = off ? [] : its.map(i => i.value);
      });
      await api('admin/menu', { admin: true, body: { start: W.start, days, holidays } });
      toast('منوی این هفته ذخیره شد ✓'); adminRender();
    });
    $('#copy').onclick = guard(async () => {
      if (!confirm('منوی این هفته با منوی هفتهٔ قبل جایگزین می‌شود. ادامه می‌دهید؟')) return;
      await api('admin/copy', { admin: true, body: { from: addDays(W.start, -7), to: W.start } });
      toast('کپی شد'); adminRender();
    });
  });

  /* ----- گزارش آشپزخانه ----- */
  const pageKitchen = guard(async () => {
    const R = await api('admin/report?' + qs({ start: A.start || '' }), { admin: true });
    A.start = R.start;
    if (!A.day || !R.days.some(d => d.date === A.day)) { const t = R.days.find(d => d.items.length); A.day = (R.days.find(d => d.date === toISO(new Date())) || t || R.days[0]).date; }
    const d = R.days.find(x => x.date === A.day);
    const v = $('#view');
    v.innerHTML = pageHead('گزارش آشپزخانه', '<button class="btn noprint" id="print">🖨️ چاپ</button><button class="btn noprint" id="csv">⬇️ فایل اکسل هفته</button>') + weekNav(R.start) +
      '<div class="chips">' + R.days.map(x => '<button class="chip" data-day="' + x.date + '" aria-selected="' + (x.date === A.day) + '">' + dowName(x.date) + ' ' + jday(x.date) + '</button>').join('') + '</div>' +
      '<h3 style="margin:0 0 10px">' + dowName(d.date) + ' ' + jday(d.date) + '</h3>' +
      (d.holiday ? '<p class="err">تعطیل: ' + esc(d.holiday) + '</p>' : !d.items.length ? '<p class="empty">برای این روز منویی ثبت نشده است.</p>' :
        '<div class="tiles">' + d.items.map(i => '<div class="tile"><div class="t">' + esc(i.name) + '</div><div class="big">' + fa(i.names.length) + '</div><div>پرس</div></div>').join('') +
        '<div class="tile red"><div class="t">مرخصی</div><div class="big">' + fa(d.skip.length) + '</div><div>نفر</div></div>' +
        '<div class="tile gray"><div class="t">هنوز انتخاب نکرده</div><div class="big">' + fa(d.pending.length) + '</div><div>نفر از ' + fa(R.total) + '</div></div></div>' +
        d.items.map(i => '<div class="panel"><h3>' + esc(i.name) + ' — ' + fa(i.names.length) + ' نفر</h3>' + pills(i.names) + '</div>').join('') +
        '<div class="panel"><h3>مرخصی</h3>' + pills(d.skip, 'red') + '</div><div class="panel"><h3>هنوز انتخاب نکرده‌اند</h3>' + pills(d.pending) + '</div>');
    bindNav(R.start);
    $$('.chip', v).forEach(c => { c.onclick = () => { A.day = c.dataset.day; adminRender(); }; });
    $('#print').onclick = () => window.print();
    $('#csv').onclick = guard(async () => {
      const r = await api('admin/export?' + qs({ start: R.start }), { admin: true });
      const blob = new Blob([r.csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'lunch-' + R.start + '.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    });
  });

  /* ----- همکاران ----- */
  const pageEmps = guard(async () => {
    const all = (await api('admin/employees', { admin: true })).employees.slice().sort((a, b) => (b.active - a.active) || a.name.localeCompare(b.name, 'fa'));
    const v = $('#view');
    v.innerHTML = pageHead('همکاران', '<span class="note" style="margin:0">' + fa(all.filter(e => e.active).length) + ' نفر فعال از ' + fa(all.length) + '</span>') +
      '<div class="panel"><h3>افزودن همکار</h3><p class="note">هر همکار در یک خط: نام و کد ملی ۱۰ رقمی (مثلاً <b>علی رضایی 0012345678</b>). کد ملی نام کاربری او می‌شود و رمز اولیه‌اش <b>۱۲۳۴</b> است.</p>' +
      '<textarea class="field" id="newlines" rows="4" placeholder="علی رضایی 0012345678&#10;سمانه عزیزی 0098765432"></textarea><div style="margin-top:10px"><button class="btn primary" id="add">افزودن</button></div></div>' +
      '<input class="field" id="srch" placeholder="جست‌وجوی نام یا کد ملی…" style="margin-bottom:12px"><div class="tbl"><table><thead><tr><th>نام</th><th>کد ملی (نام کاربری)</th><th>رمز</th><th>وضعیت</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>';
    const draw = () => {
      const q = $('#srch').value.trim();
      $('#tb').innerHTML = all.filter(e => !q || e.name.includes(q) || e.nid.includes(q)).map(e => '<tr data-id="' + e.id + '" data-active="' + (e.active ? 1 : 0) + '">' +
        '<td><input class="field nm" value="' + esc(e.name) + '" aria-label="نام"></td><td><input class="field ltr nid" value="' + esc(e.nid) + '" maxlength="10" aria-label="کد ملی"></td>' +
        '<td>' + (e.custom ? '<span class="pill">شخصی</span>' : '<span class="pill red">اولیه (۱۲۳۴)</span>') + '</td>' +
        '<td>' + (e.active ? '<span class="pill">فعال</span>' : '<span class="pill red">غیرفعال</span>') + '</td>' +
        '<td style="white-space:nowrap"><button class="btn sm sv">ذخیره</button> <button class="btn sm rs" title="رمز به ۱۲۳۴ برگردد">ریست رمز</button> <button class="btn sm tg">' + (e.active ? 'غیرفعال' : 'فعال') + '</button></td></tr>').join('') ||
        '<tr><td colspan="5" class="empty">موردی پیدا نشد.</td></tr>';
    };
    draw();
    $('#srch').oninput = draw;
    $('#add').onclick = guard(async () => {
      const r = await api('admin/employees/add', { admin: true, body: { lines: $('#newlines').value.split('\n') } });
      toast(fa(r.added) + ' نفر اضافه شد' + (r.skipped.length ? ' · ' + fa(r.skipped.length) + ' تکراری' : '') + (r.bad.length ? ' · ' + fa(r.bad.length) + ' خط نامعتبر' : ''), !!r.bad.length);
      adminRender();
    });
    v.onclick = guard(async ev => {
      const tr = ev.target.closest('tr[data-id]'); if (!tr) return;
      const id = +tr.dataset.id, c = ev.target.classList;
      if (c.contains('sv')) { await api('admin/employees/update', { admin: true, body: { id, name: $('.nm', tr).value, nid: $('.nid', tr).value } }); toast('ذخیره شد ✓'); adminRender(); }
      else if (c.contains('rs')) { if (!confirm('رمز این همکار به ۱۲۳۴ برمی‌گردد و در ورود بعدی باید رمز جدید بگذارد. ادامه می‌دهید؟')) return; await api('admin/employees/reset', { admin: true, body: { id } }); toast('رمز ریست شد'); adminRender(); }
      else if (c.contains('tg')) { await api('admin/employees/update', { admin: true, body: { id, active: tr.dataset.active !== '1' } }); adminRender(); }
    });
  });

  /* ----- امتیاز غذاها ----- */
  const pageRates = guard(async () => {
    const list = (await api('admin/dishes', { admin: true })).dishes;
    $('#view').innerHTML = pageHead('امتیاز غذاها') + '<p class="note">میانگین امتیاز همکاران به هر غذا (از همهٔ هفته‌ها).</p>' +
      (list.length ? '<div class="tbl"><table><thead><tr><th>#</th><th>غذا</th><th>میانگین</th><th>تعداد رأی</th></tr></thead><tbody>' + list.map((x, i) =>
        '<tr><td>' + fa(i + 1) + '</td><td><b>' + esc(x.name) + '</b></td><td>' + (x.n ? stars(x.avg) + ' ' + avgTxt(x.avg) : '—') + '</td><td>' + fa(x.n) + '</td></tr>').join('') + '</tbody></table></div>' : '<p class="empty">هنوز غذایی ثبت نشده است.</p>');
  });

  /* ----- تنظیمات ----- */
  const pageSettings = guard(async () => {
    const s = await api('admin/settings', { admin: true });
    $('#view').innerHTML = pageHead('تنظیمات') + '<div class="panel" style="max-width:640px"><h3>مهلت ثبت انتخاب</h3><div class="inline" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label for="ld">رزرو هر روز تا پایانِ</label>' +
      '<select id="ld" class="field" style="max-width:110px">' + [0, 1, 2, 3, 4, 5, 6, 7, 10, 14].map(n => '<option value="' + n + '" ' + (n === s.lockDays ? 'selected' : '') + '>' + fa(n) + '</option>').join('') + '</select>' +
      '<span>روز قبل از آن روز باز است (۰ = تا پایان همان روز).</span></div>' +
      '<h3 style="margin-top:18px">امتیازدهی</h3><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label for="rh">امتیازدهی هر روز از ساعت</label><select id="rh" class="field" style="max-width:110px">' +
      Array.from({ length: 24 }, (_, n) => '<option value="' + n + '" ' + (n === s.ratingHour ? 'selected' : '') + '>' + fa(n) + '</option>').join('') + '</select><span>(وقت تهران) باز می‌شود.</span></div>' +
      '<div style="margin-top:16px"><button class="btn primary" id="sv">ذخیره</button></div></div>' +
      '<div class="panel" style="max-width:640px"><h3>رمز مدیر</h3><p class="note">رمز مدیر از تنظیمات Cloudflare (Secret با نام <b>ADMIN_PASSWORD</b>) عوض می‌شود.</p></div>';
    $('#sv').onclick = guard(async () => { await api('admin/settings', { admin: true, body: { lockDays: +$('#ld').value, ratingHour: +$('#rh').value } }); toast('ذخیره شد ✓'); });
  });

  /* ---------- شروع ---------- */
  function route() {
    if (location.hash === '#admin') adminMain();
    else startApp();
  }
  window.addEventListener('hashchange', route);
  route();
}
clientMain();
</script></body></html>
